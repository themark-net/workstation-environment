---
- name: Skip when disabled
  ansible.builtin.meta: end_role
  when: not (ltz_enable_TEMPLATE | default(false) | bool)

- name: Ensure state dir
  ansible.builtin.file:
    path: /var/lib/ltz-trust
    state: directory
    mode: "0750"

- name: Placeholder status (replace when role is real)
  ansible.builtin.copy:
    dest: "{{ ltz_TEMPLATE_status_path }}"
    mode: "0644"
    content: |
      {"role":"TEMPLATE","enabled":true,"implemented":false,"ts":{{ ansible_date_time.epoch }}}
